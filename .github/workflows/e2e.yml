# Runs the real stack (PostgreSQL 13 → API → storefront) and drives it with a browser: signing in,
# every admin page, product/category/user/import flows, the storefront and the cart.
# Screenshots go to the `e2e-shots` branch so design changes can be reviewed before merging.
name: E2E

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "e2e/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "e2e/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

permissions:
  contents: write # push the e2e-shots branch

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:  # same major version as HostItBro
        image: postgres:13
        env:
          POSTGRES_USER: wcw
          POSTGRES_PASSWORD: wcw
          POSTGRES_DB: wcw_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wcw" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for this run only; nothing here is a real credential.
      DATABASE_URL: postgresql+asyncpg://wcw:wcw@127.0.0.1:5432/wcw_e2e
      JWT_SECRET: e2e-only-secret-0123456789abcdef0123456789
      CORS_ORIGINS: '["http://127.0.0.1:3000"]'
      SITE_URL: http://127.0.0.1:3000
      CONTACT_TO: shop@example.com
      MEDIA_SERVE: "true"
      MEDIA_URL: http://127.0.0.1:8000/media
      ADMIN_EMAIL: e2e-admin@example.com
      ADMIN_PASSWORD: E2e-only-Passw0rd-${{ github.run_id }}
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_API_URL: http://127.0.0.1:8000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # same major version as the server

      - name: API — install, migrate, seed
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.seed

      - name: API — start
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health

      - name: Storefront — build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_ALLOW_INDEXING: "false"
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Storefront — start
        env:
          API_URL: http://127.0.0.1:8000/api/v1
          PORT: "3000"
          HOSTNAME: 127.0.0.1
        run: |
          mkdir -p bundle/.next
          cp -a frontend/.next/standalone/. bundle/
          cp -a frontend/.next/static bundle/.next/static
          cp -a frontend/public bundle/public
          cd bundle
          nohup node server.js > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/robots.txt && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:3000/robots.txt

      - name: Browser tests — install
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser tests — type check
        working-directory: e2e
        run: npx tsc --noEmit

      - name: Unit tests (formatting and date-range helpers, in three time zones)
        working-directory: e2e
        run: |
          for tz in America/Chicago UTC Pacific/Auckland; do
            echo "::group::TZ=$tz"
            TZ=$tz npm run --silent test:unit
            echo "::endgroup::"
          done

      - name: Browser tests — run
        working-directory: e2e
        run: npx playwright test

      - name: Results
        if: always()
        working-directory: e2e
        run: node scripts/summarize.mjs

      - name: Server logs (on failure)
        if: failure()
        run: |
          echo "::group::api.log"; tail -n 80 api.log || true; echo "::endgroup::"
          echo "::group::web.log"; tail -n 80 web.log || true; echo "::endgroup::"
          err=$(grep -iE "error|traceback|exception" api.log | tail -n 15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$err" ] && echo "::warning title=API log (errors)::${err}"
          exit 0

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Publish screenshots
        # Reviewable PNGs of every admin page and key storefront pages on the `e2e-shots` branch.
        if: always() && hashFiles('e2e/shots/*') != ''
        continue-on-error: true
        run: |
          cd e2e/shots
          git init -q -b e2e-shots
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "E2E screenshots of ${{ github.head_ref || github.ref_name }} @ ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" e2e-shots
