name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:  # same major version as HostItBro
        image: postgres:13
        env:
          POSTGRES_USER: wcw
          POSTGRES_PASSWORD: wcw
          POSTGRES_DB: wcw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wcw" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://wcw:wcw@localhost:5432/wcw_test
      TEST_DATABASE_URL: postgresql+asyncpg://wcw:wcw@localhost:5432/wcw_test
      DB_USE_NULL_POOL: "true"
      JWT_SECRET: ci-only-secret
      CONTACT_TO: shop@example.com
      SITE_URL: https://shop.windycitywares.com
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt httpx
      - name: Migrations (upgrade, downgrade one step, upgrade again)
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: Tests (unit + API against PostgreSQL)
        run: |
          set +e
          python -m unittest discover -v tests > ../test.log 2>&1
          status=$?
          cat ../test.log
          if [ $status -ne 0 ]; then
            # Surface the failure as an annotation (readable via the checks API, unlike raw logs).
            body=$(grep -v "^test_.* ok$" ../test.log | tail -n 80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Backend tests failed::${body}"
          fi
          exit $status
