# Builds the Next.js storefront. On `main` it also publishes the ready-to-run bundle to the
# `storefront-build` branch; the HostItBro server pulls that branch (read-only deploy key)
# via deploy/update-storefront.sh. No server credentials are stored in GitHub.
name: Storefront

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/storefront.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/storefront.yml"]
  workflow_dispatch:

permissions:
  contents: write # push the storefront-build branch

concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public settings baked into the build. Override with repository Variables if needed.
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://shop.windycitywares.com' }}
      NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'https://api.windycitywares.com/api/v1' }}
      NEXT_PUBLIC_ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING || 'false' }}
      API_URL: ${{ vars.API_URL || 'https://api.windycitywares.com/api/v1' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # same major version as the server

      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Assemble bundle
        run: |
          mkdir -p bundle/.next
          cp -a frontend/.next/standalone/. bundle/
          cp -a frontend/.next/static bundle/.next/static
          cp -a frontend/public bundle/public
          printf '%s\n' "$GITHUB_SHA" > bundle/BUILD_SHA
          du -sh bundle bundle/node_modules

      - name: Smoke test the bundle
        working-directory: bundle
        env:
          PORT: "3005"
          HOSTNAME: 127.0.0.1
        run: |
          node server.js > ../server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3005/robots.txt && break; sleep 1; done
          curl -sf http://127.0.0.1:3005/robots.txt
          fail=0
          check() { # path, expected status, [extra curl args...]
            local path=$1 want=$2; shift 2
            local got; got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$@" "http://127.0.0.1:3005$path")
            echo "::notice title=smoke $path::$got (want $want)"
            case "$got" in "$want"*) ;; *) fail=1;; esac
          }
          check / 200
          for path in /es /nl /es/shop /nl/cart /shop /admin /contact /es/contact /nl/contact /forgot-password /reset-password; do check "$path" 200; done
          check /shop "307 http://127.0.0.1:3005/nl/shop" -H 'Accept-Language: nl-BE,nl;q=0.9,en;q=0.8'
          check /shop 200 -H 'Accept-Language: es' -H 'Cookie: NEXT_LOCALE=en'
          curl -s http://127.0.0.1:3005/es | grep -q '<html lang="es"' || { echo "::error::/es is not lang=es"; fail=1; }
          if [ "$fail" = 1 ]; then
            echo "::error title=server log::$(tail -c 1500 ../server.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Preview screenshots (pull requests)
        # Renders key pages against the live catalog and pushes PNGs to the `previews` branch,
        # so a design change can be reviewed before it is merged.
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: bundle
        env:
          PORT: "3006"
          HOSTNAME: 127.0.0.1
        run: |
          node server.js > ../preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3006/robots.txt && break; sleep 1; done
          npx -y playwright@1.56.1 install --with-deps chromium > /dev/null
          slug=$(curl -s "$API_URL/products?page_size=1&sort=newest" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).items[0].slug))')
          mkdir -p ../shots
          shoot() { # name, path, width, height
            npx -y playwright@1.56.1 screenshot --browser chromium --viewport-size="$3,$4" --full-page --wait-for-timeout 2500 \
              "http://127.0.0.1:3006$2" "../shots/$1.png" || echo "::warning::screenshot $1 failed"
          }
          shoot home-desktop / 1440 900
          shoot home-mobile / 390 844
          shoot shop-desktop /shop 1440 900
          shoot product-desktop "/product/$slug" 1440 900
          shoot product-mobile "/product/$slug" 390 844
          shoot category-es /es/category/birds-wildlife 1440 900
          shoot home-nl /nl 1440 900
          shoot contact-desktop /contact 1440 900
          shoot contact-es-mobile /es/contact 390 844
          shoot forgot-password /forgot-password 1440 900
          shoot reset-password-nl "/nl/reset-password?token=preview-token-preview-token" 1440 900
          cd ../shots
          git init -q -b previews
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Previews of ${{ github.head_ref || github.ref_name }} @ ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" previews

      - name: Publish to storefront-build branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: bundle
        run: |
          git init -q -b storefront-build
          git add -A -f .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Storefront build of ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" storefront-build
