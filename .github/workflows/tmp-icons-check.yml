name: tmp-icons-check
on:
  push:
    branches: [feat/untitled-icons-admin]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: frontend
        run: |
          npm install --no-audit --no-fund 2>&1 | tail -5
          npx tsc --noEmit --pretty false 2>&1 | grep -v "^ " | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
          ls node_modules/@untitledui/icons/package.json && grep '"version"' node_modules/@untitledui/icons/package.json | sed 's/^/::notice::/'
          true
